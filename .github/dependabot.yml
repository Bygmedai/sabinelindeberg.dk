# Dependabot config — S549 TIER-POLITIK (Stevens TIER-SVAR, 2026-08-06).
# Dette repo er IKKE tier-value: INGEN version-opdateringer, med vilje.
# open-pull-requests-limit: 0 stopper al version-støj. Security-opdateringer
# rammes IKKE af limit (GitHub docs) og samles i én PR pr. økosystem —
# en reel CVE giver stadig præcis én PR, alt andet giver nul.
# Kanon: governance 06-quality-and-ops/dependencies/REPO-TIER-REGISTRY-v1.0.md
# Ændring af politik = ændr repoets tier-topic + denne fil, intet andet.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      # S496-opfoelgning (Steven GO 19/9-2026): sikkerhedsgruppen er delt i prod og dev.
      # Maalt i bygmedai-portal#97: den udelte gruppe lagde en udeklareret dev-major
      # (vitest ^4 -> ^5) i SAMME PR som en kritisk next-RCE-patch. npm ci doede paa
      # ERESOLVE, hele quality-gate faldt, og main stod paa den saarbare next i en uge.
      # Det er praecis fejlklassen S546 allerede loeste for version-updates ("en gruppe
      # der ikke kan merges, leverer nul opdateringer") — nu ogsaa for security-updates.
      # Vi bruger IKKE ignore paa majors: ignore gaelder ogsaa security-updates og ville
      # skjule CVEs hvis kun en major lukker dem (GHSA-82fw-gwwq-j7x9 er netop saadan en).
      npm-security-prod:
        applies-to: security-updates
        dependency-type: "production"
        patterns: ["*"]
      npm-security-dev:
        applies-to: security-updates
        dependency-type: "development"
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]