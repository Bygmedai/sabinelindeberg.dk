name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build 11ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx @11ty/eleventy
      - name: Verify build output
        run: |
          echo "=== Files ===" && find _site -name "*.html" | sort
          echo "=== CNAME ===" && cat _site/CNAME
          echo "=== YAML leakage ===" && grep -r 'jsonLd: |' _site/ | wc -l
          echo "=== Style balance ==="
          for f in $(find _site -name "*.html"); do
            open=$(grep -o '<style' "$f" | wc -l)
            close=$(grep -o '</style>' "$f" | wc -l)
            if [ "$open" != "$close" ]; then echo "MISMATCH: $f"; exit 1; fi
          done
          echo "All checks passed"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
