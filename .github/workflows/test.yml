name: Quality Gate

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build 11ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx @11ty/eleventy
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
          retention-days: 1

  html-validate:
    name: HTML Validation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g html-validate
      - name: Validate all HTML files
        run: |
          FILES=$(find _site -name "*.html" | sort)
          if [ -z "$FILES" ]; then
            echo "No HTML files found"
            exit 0
          fi
          html-validate $FILES

  broken-links:
    name: Broken Link Check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g linkinator
      - name: Start local server
        run: |
          npx http-server _site -p 8080 -s &
          sleep 2
      - name: Check internal links
        run: |
          linkinator http://localhost:8080 --recurse --skip "^(?!http://localhost)" --format json --timeout 10000 > link-report.json || true
          python3 -c "
          import json, sys
          data = json.load(open('link-report.json'))
          links = data.get('links', data) if isinstance(data, dict) else data
          if isinstance(links, dict):
              links = links.get('links', [])
          broken = [l for l in links if isinstance(l, dict) and l.get('status', 0) >= 400]
          if broken:
              for l in broken:
                  print(f'  {l.get(\"status\",\"?\")} {l.get(\"url\",\"?\")}')
              print(f'::error::Found {len(broken)} broken links')
              sys.exit(1)
          else:
              print('No broken links found')
          "

  lighthouse:
    name: Lighthouse Audit
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install -g @lhci/cli
          npm install -g http-server
      - name: Start local server
        run: |
          http-server _site -p 8080 -s &
          sleep 2
      - name: Run Lighthouse on key pages (hard gates)
        run: |
          PAGES=(
            "http://localhost:8080/"
            "http://localhost:8080/hypnoseterapi/"
            "http://localhost:8080/terapeutisk-samtale/"
            "http://localhost:8080/shamanistiske-cirkler/"
            "http://localhost:8080/om-sabine/"
            "http://localhost:8080/kontakt/"
          )
          # Lighthouse-budgets — fail PR hvis nogle af disse ikke holdes.
          MIN_PERF=80
          MIN_A11Y=95
          MIN_SEO=95
          MIN_BP=90
          FAILED=0
          for URL in "${PAGES[@]}"; do
            echo "=== Testing $URL ==="
            rm -rf .lighthouseci
            lhci collect --url="$URL" --settings.chromeFlags="--no-sandbox --headless" || true
            REPORT=$(ls -t .lighthouseci/lhr-*.json 2>/dev/null | head -1)
            if [ -f "$REPORT" ]; then
              python3 - "$REPORT" "$MIN_PERF" "$MIN_A11Y" "$MIN_SEO" "$MIN_BP" <<'PYEOF'
          import json, sys
          report, min_perf, min_a11y, min_seo, min_bp = sys.argv[1], *map(int, sys.argv[2:])
          data = json.load(open(report))
          cats = data.get('categories', {})
          perf = int((cats.get('performance', {}).get('score') or 0) * 100)
          a11y = int((cats.get('accessibility', {}).get('score') or 0) * 100)
          seo  = int((cats.get('seo', {}).get('score') or 0) * 100)
          bp   = int((cats.get('best-practices', {}).get('score') or 0) * 100)
          print(f'  Performance: {perf} | A11y: {a11y} | SEO: {seo} | BP: {bp}')
          failed = []
          if perf < min_perf: failed.append(f'Performance {perf} < {min_perf}')
          if a11y < min_a11y: failed.append(f'Accessibility {a11y} < {min_a11y}')
          if seo  < min_seo : failed.append(f'SEO {seo} < {min_seo}')
          if bp   < min_bp  : failed.append(f'Best-Practices {bp} < {min_bp}')
          if failed:
              for f in failed: print(f'  ::error::{f}')
              sys.exit(1)
          PYEOF
              if [ $? -ne 0 ]; then FAILED=1; fi
            fi
          done
          if [ $FAILED -eq 1 ]; then
            echo "::error::Lighthouse-budgets fejlede — se ovenfor for detaljer"
            exit 1
          fi
